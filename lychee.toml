# =============================================================================
# lychee 链接体检配置
# -----------------------------------------------------------------------------
# 设计原则（2026-11-18 重构）：
#
# 反复假红的根因不是「某条链接坏了」，而是「逐域名拉黑」这个策略本身：
# 每发现一个反爬站点就加一条 --exclude，永远追不完，还会误伤真死链。
#
# 因此分三层处理：
#   1. 传输层假红（超时 / 连接重置）→ accept_timeouts，从根上消除，不逐域名处理；
#   2. 反爬 / 协议错站点        → exclude 白名单，集中在此文件，逐条注明原因和验证日期；
#   3. 真失效链接              → 照常报错，必须修复。
#
# 维护指南：
#   - 新增假红站点：先判断属于哪一层。超时类无需加 exclude（第 1 层已覆盖）。
#   - 只有确认「浏览器能开、CI 拿不到」的站点才加进第 2 层 exclude，
#     并写明原因 + 验证日期 + 验证方式，禁止无脑追加。
#   - 想恢复对某站点的检查：删掉对应 exclude 行即可。
#   - 修改本文件后本地自测：
#       lychee --config lychee.toml --no-progress --accept 200,206,429 --cache \
#         --max-cache-age 1d --user-agent "<浏览器UA>" \
#         README.md README.en.md "resources/*.md" "interview/*.md"
# =============================================================================

# 输出格式与 Summary 对齐（lychee-action 默认 markdown 输出到 lychee/out.md）
format = "markdown"
no_progress = true

# -----------------------------------------------------------------------------
# 第 1 层：传输层假红
# -----------------------------------------------------------------------------
# 超时不计为错误（TI E2E / ST wiki 等站点对 CI 数据中心 IP 经常性超时，
# 浏览器可正常打开）。lychee 会单独归类为 Timeouts，不影响退出码。
accept_timeouts = true

# -----------------------------------------------------------------------------
# 缓存：避免假红状态码被缓存后反复作祟
# -----------------------------------------------------------------------------
cache = true
max_cache_age = "1d"
# 429（限流）、5xx（对方临时故障）不写缓存，下次重试有机会拿到正常结果
cache_exclude_status = "429, 500..599"

# -----------------------------------------------------------------------------
# 请求调优：降低被反爬盯上的概率
# -----------------------------------------------------------------------------
max_retries = 3
retry_wait_time = 5
timeout = 30
max_concurrency = 8
host_concurrency = 3
host_request_interval = "100ms"
user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

# 接受的状态码：200/206 正常，429 限流不算失效。
# 注意：403 不放行——真 403 要暴露；反爬站点走下方 exclude。
accept = ["200", "206", "429"]

# -----------------------------------------------------------------------------
# 第 2 层：反爬 / 协议错站点白名单
# -----------------------------------------------------------------------------
# 每条格式：域名 —— 原因（验证日期 / 验证方式）
exclude = [
    # TI E2E：对 CI 数据中心 IP 返 403（2026-11-18 复测 403，浏览器可开）
    'e2e\.ti\.com',
    # TI 主站：同上（2026-11-18 复测）
    'www\.ti\.com',
    # ST wiki：对 CI IP 超时 / 403（2026-11-18 复测 timeout）
    'wiki\.st\.com',
    'www\.st\.com',
    # Microchip 主站：对 CI IP 返 403（2026-11-18 复测 403）
    'www\.microchip\.com',
    # Microchip xwiki：宣告 HTTP/2 但实现有问题，lychee 走 h2 报 E1000 协议错，
    # 浏览器走 h1 正常。属传输层错误，--accept 放行不了（2026-08 验证）
    'developerhelp\.microchip\.com',
    # NXP 日本站：对「带浏览器 UA 的非住宅 IP」返假 404，浏览器 / 不带 UA 均为 200
    # （2026-11-18 复测 AN12235/AN14454 均 404）
    'www\.nxp\.jp',
    # Infineon：对 CI IP 反爬（历史验证）
    'www\.infineon\.com',
    # 哔哩哔哩：空间页对 CI IP 返 403/412（历史验证）
    'space\.bilibili\.com',
    # Tektronix：官网首页对非住宅 IP 返 403（2026-11-18 复测 403，浏览器可开）。
    # 本次触发假红的站点，加入后 Link Check 应恢复全绿。
    'www\.tek\.com',
]
