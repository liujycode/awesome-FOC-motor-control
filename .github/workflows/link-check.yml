name: Link Check

# 链接体检：定期（每周）+ push/PR 时检查 Markdown 里的外链是否失效。
# 所有检查参数、反爬白名单、超时策略统一放在仓库根目录的 lychee.toml，
# 本 workflow 只负责触发检查 + 上传报告。新增假红站点只需改 lychee.toml。

on:
  push:
    branches: [main, 'chore/**']
  pull_request:
    branches: [main]
  schedule:
    # 每周一 02:00 UTC = 北京时间 10:00
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    name: Markdown 外链检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # 缓存检查结果：减少重复请求，降低触发对方限流（429）的概率。
      # 注意 lychee.toml 里设了 cache=true 且把 429/5xx 排除出缓存，
      # 因此假红状态码不会被缓存下来反复作祟。
      - name: 恢复链接检查缓存
        uses: actions/cache@v4
        with:
          path: .lycheecache
          key: lychee-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            lychee-${{ github.ref }}-
            lychee-

      - name: 用 lychee 检查链接
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          # 路径是 glob；中文文件名由 glob 覆盖，统一加引号防 shell 拆词。
          # 其余全部参数（超时策略 / 反爬白名单 / UA / 缓存 / 接受码）
          # 均从 lychee.toml 读取，避免配置分散在两处产生分歧。
          args: >-
            --config lychee.toml
            "README.md"
            "README.en.md"
            "resources/*.md"
            "interview/*.md"
        env:
          # 用 token 提升 GitHub API 速率上限并减少 403（只读，不需要额外权限）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 保存检查报告（失败时便于定位）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-report
          path: lychee/out.md
          if-no-files-found: ignore
          retention-days: 14
